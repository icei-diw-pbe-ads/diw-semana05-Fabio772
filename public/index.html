<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pessoas e Produções</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- CSS Customizado -->
  <link rel="stylesheet" href="styles.css">

  <style>
    /* Grid moderno */
    #cards-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    /* Cards */
    .card {
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .card:hover {
      transform: translateY(-5px) scale(1.03);
      box-shadow: 0 15px 25px rgba(0,0,0,0.3);
    }

    /* Fade-in */
    .fade-in {
      animation: fadeIn 0.5s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px);}
      to { opacity: 1; transform: translateY(0);}
    }

    /* Botão ativo */
    .btn-active {
      background-color: #ff416c;
      color: white;
    }

    /* Área expansível "Ver mais" */
    .more-content {
      display: none;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed #ccc;
    }
  </style>
</head>
<body class="bg-light text-dark">

<header class="site-header p-3 mb-4">
  <div class="container d-flex justify-content-between align-items-center">
    <h1 class="h3 mb-0">Pessoas e Produções</h1>
    <nav class="main-nav">
      <ul class="nav">
        <li class="nav-item"><a class="nav-link text-white" href="#cards">Cards</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="#inscricao">Inscrição</a></li>
      </ul>
    </nav>
  </div>
</header>

<main class="container">

  <!-- Barra de pesquisa -->
  <section class="mb-4">
    <input type="text" id="search-input" class="form-control" placeholder="Pesquisar por nome..." onkeyup="pesquisarCards()">
  </section>

  <!-- Filtros -->
  <section class="mb-4">
    <div class="btn-group mb-3" role="group" id="filter-buttons">
      <button class="btn btn-outline-primary btn-active" onclick="filtrarCards('Todos', this)">Todos</button>
      <button class="btn btn-outline-primary" onclick="filtrarCards('Autor', this)">Autores</button>
      <button class="btn btn-outline-primary" onclick="filtrarCards('Pesquisador', this)">Pesquisadores</button>
      <button class="btn btn-outline-primary" onclick="filtrarCards('Artista', this)">Artistas</button>
    </div>
  </section>

  <!-- Cards Dinâmicos -->
  <section id="cards" class="category mb-5">
    <div id="cards-container">
      <!-- Cards serão montados dinamicamente -->
    </div>
  </section>

  <!-- Formulário -->
  <section id="inscricao" class="category mb-5">
    <h2 class="mb-3">Inscreva-se para novidades</h2>
    <form class="signup-form">
      <div class="mb-3">
        <label for="nome" class="form-label">Nome:</label>
        <input type="text" id="nome" name="nome" class="form-control" placeholder="Seu nome" required>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">E-mail:</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="Seu e-mail" required>
      </div>
      <button type="submit" class="btn btn-primary">Enviar</button>
    </form>
  </section>
</main>

<footer class="site-footer text-white text-center p-3 mt-4">
  <p class="mb-0">&copy; 2025 Pessoas e Produções. Todos os direitos reservados.</p>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Script JSON + montagem -->
<script src="app.js"></script>
</body>
</html>
